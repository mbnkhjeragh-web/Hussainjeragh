<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFWML Sample Submission</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--muted:#5b6b78;--line:#d7dee4;--accent:#0b5f7a;--accent-ink:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{margin-bottom:20px}
.org{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:26px;margin:4px 0 2px}
.ar{font-family:"Noto Sans Arabic",system-ui,sans-serif;direction:rtl}
.sub{color:var(--muted);margin:0}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.f{margin-bottom:16px}
label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;margin-bottom:6px}
label .ar{font-weight:400;color:var(--muted)}
.req{color:#b42318}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{font-weight:400;justify-content:flex-start;align-items:center;margin:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.checks input{width:auto;margin:0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media (max-width:420px){.row,.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="org">KISR · Petroleum Research Center · OFWML</div>
  <h1>Sample Submission</h1>
  <p class="sub ar">نموذج تسليم العينات</p>
</header>

<form id="sampleForm" action="https://formsubmit.co/Hjeragh@kisr.edu.kw" method="POST">
  <input type="hidden" name="_subject" value="New OFWML sample submission">
  <input type="hidden" name="_cc" value="mbnkhjeragh@gmail.com">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="">
  <input type="hidden" name="Tests requested" id="testsField" value="">
  <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">

  <div class="f">
    <label for="project">Project name <span class="req">*</span><span class="ar">اسم المشروع</span></label>
    <input id="project" name="Project name" type="text" required>
  </div>

  <div class="row">
    <div class="f">
      <label for="client">Your name <span class="req">*</span></label>
      <input id="client" name="Client name" type="text" required>
    </div>
    <div class="f">
      <label for="org">Organization</label>
      <input id="org" name="Organization" type="text" placeholder="e.g. KOC">
    </div>
  </div>

  <div class="row">
    <div class="f">
      <label for="email">Email <span class="req">*</span></label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="f">
      <label for="phone">Phone</label>
      <input id="phone" name="Phone" type="tel">
    </div>
  </div>

  <div class="row">
    <div class="f">
      <label for="n">No. of samples <span class="req">*</span></label>
      <input id="n" name="Number of samples" type="number" min="1" required>
    </div>
    <div class="f">
      <label for="type">Sample type</label>
      <select id="type" name="Sample type">
        <option>Produced water</option>
        <option>Injection water</option>
        <option>Effluent water</option>
        <option>Seawater</option>
        <option>Polymer solution</option>
        <option>Other</option>
      </select>
    </div>
  </div>

  <div class="f">
    <label for="ids">Sample IDs / well names <span class="ar">أرقام العينات</span></label>
    <input id="ids" name="Sample IDs" type="text" placeholder="e.g. W-101, W-102">
  </div>

  <div class="f">
    <label>Tests requested <span class="ar">الفحوصات المطلوبة</span></label>
    <div class="checks">
      <label><input type="checkbox" class="test" value="pH"> pH</label>
      <label><input type="checkbox" class="test" value="Conductivity / TDS"> Conductivity / TDS</label>
      <label><input type="checkbox" class="test" value="Turbidity"> Turbidity</label>
      <label><input type="checkbox" class="test" value="Density"> Density</label>
      <label><input type="checkbox" class="test" value="Viscosity"> Viscosity</label>
      <label><input type="checkbox" class="test" value="Oil in water"> Oil in water</label>
      <label><input type="checkbox" class="test" value="Ions analysis"> Ions analysis</label>
      <label><input type="checkbox" class="test" value="FTIR"> FTIR</label>
    </div>
  </div>

  <div class="f">
    <label for="notes">Notes <span class="ar">ملاحظات</span></label>
    <textarea id="notes" name="Notes" placeholder="Other tests, deadlines, special handling…"></textarea>
  </div>

  <button type="submit">Submit · إرسال</button>
</form>
<footer>Oil-Field Water Management Laboratory · Kuwait Institute for Scientific Research</footer>
</div>
<script>
const f=document.getElementById('sampleForm');
f.querySelector('[name=_next]').value=new URL('thanks.html',location.href).href;
f.addEventListener('submit',()=>{
  document.getElementById('testsField').value=[...f.querySelectorAll('.test:checked')].map(c=>c.value).join(', ')||'None selected';
  const b=f.querySelector('button');b.disabled=true;b.textContent='Sending… · جاري الإرسال';
});
</script>
</body>
</html>
