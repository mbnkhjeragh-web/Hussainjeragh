<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Polo Room — Ralph Lauren Inspired</title>
  <meta name="description" content="An immersive, hand-styled preppy interior inspired by the world of Polo Ralph Lauren." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
</head>
<body>
  <!-- ambient overlays -->
  <div class="vignette"></div>
  <div class="grain"></div>

  <header class="topbar">
    <div class="crest">
      <span class="crest-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="34" height="34" role="img" aria-label="Polo player emblem">
          <g fill="currentColor">
            <!-- horse body -->
            <path d="M14 40c3-2 6-3 9-3l4-4 3 2 5-6 4 1 3-4 3 1-1 4-4 3-2 6-3 4-5 2h-6l-4-3-4 1-3-2z"/>
            <!-- legs -->
            <rect x="18" y="44" width="2.4" height="10" rx="1"/>
            <rect x="26" y="45" width="2.4" height="10" rx="1"/>
            <rect x="34" y="44" width="2.4" height="10" rx="1"/>
            <rect x="40" y="43" width="2.4" height="10" rx="1"/>
            <!-- rider -->
            <circle cx="30" cy="18" r="3.4"/>
            <path d="M30 21c3 0 5 3 5 6l-3 4-4-2-1-5c0-2 1-3 3-3z"/>
            <!-- mallet -->
            <rect x="33" y="6" width="2" height="16" rx="1" transform="rotate(28 34 14)"/>
          </g>
        </svg>
      </span>
      <span class="crest-text">
        <strong>THE&nbsp;POLO&nbsp;ROOM</strong>
        <em>Est. 1967 · Ralph Lauren inspired</em>
      </span>
    </div>

    <nav class="controls" aria-label="Room controls">
      <button id="lampBtn" class="ctl" aria-pressed="true">
        <span class="dot"></span> Lamps
      </button>
      <button id="fireBtn" class="ctl" aria-pressed="true">
        <span class="dot"></span> Fireplace
      </button>
      <button id="dayBtn" class="ctl">
        <span class="dot"></span> Daylight
      </button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <!-- ===================== THE ROOM ===================== -->
    <section class="room" aria-label="Preppy study room scene">

      <!-- Back wall with wainscoting & oxford stripe -->
      <div class="wall wall-back">
        <div class="stripe-wall"></div>
        <div class="wainscot"></div>

        <!-- Window with garden view -->
        <div class="window">
          <div class="sky"></div>
          <div class="hedge"></div>
          <div class="mullion mullion-v"></div>
          <div class="mullion mullion-h"></div>
          <div class="drape drape-l"></div>
          <div class="drape drape-r"></div>
        </div>

        <!-- Framed equestrian art -->
        <figure class="frame frame-1" title="Polo at dusk">
          <div class="art art-polo"></div>
        </figure>
        <figure class="frame frame-2" title="The bay stallion">
          <div class="art art-horse"></div>
        </figure>

        <!-- Sconces -->
        <div class="sconce sconce-l"><span class="glow"></span></div>
        <div class="sconce sconce-r"><span class="glow"></span></div>
      </div>

      <!-- Floor -->
      <div class="floor">
        <div class="rug"></div>
      </div>

      <!-- ============ FURNITURE ============ -->

      <!-- Bookcase -->
      <div class="bookcase">
        <div class="shelf">
          <span class="book b-navy" style="height:52px"></span>
          <span class="book b-burg" style="height:60px"></span>
          <span class="book b-tan" style="height:46px"></span>
          <span class="book b-green" style="height:58px"></span>
          <span class="book b-navy" style="height:50px"></span>
          <span class="book b-cream" style="height:44px"></span>
        </div>
        <div class="shelf">
          <span class="book b-green" style="height:56px"></span>
          <span class="book b-tan" style="height:48px"></span>
          <span class="book b-burg" style="height:62px"></span>
          <span class="book b-navy" style="height:44px"></span>
          <span class="book b-cream" style="height:54px"></span>
          <span class="book b-burg" style="height:50px"></span>
        </div>
        <div class="shelf">
          <span class="trophy" title="Silver polo cup">🏆</span>
          <span class="book b-navy" style="height:46px"></span>
          <span class="book b-tan" style="height:58px"></span>
          <span class="book b-green" style="height:52px"></span>
          <span class="globe" title="Antique globe"></span>
        </div>
      </div>

      <!-- Fireplace -->
      <div class="fireplace" id="fireplace">
        <div class="mantel"></div>
        <div class="firebox">
          <div class="flames">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="logs"></div>
        </div>
        <div class="hearth"></div>
        <!-- Mantel objects -->
        <span class="clock" title="Brass mantel clock">🕰️</span>
        <span class="candle candle-l"></span>
        <span class="candle candle-r"></span>
      </div>

      <!-- Leather club chair -->
      <div class="chair">
        <div class="chair-back"></div>
        <div class="chair-arm arm-l"></div>
        <div class="chair-arm arm-r"></div>
        <div class="chair-seat"></div>
        <div class="chair-cushion"><div class="tartan-throw"></div></div>
      </div>

      <!-- Side table + lamp -->
      <div class="side-table">
        <div class="lamp" id="lamp">
          <div class="lamp-shade"></div>
          <div class="lamp-glow"></div>
          <div class="lamp-stem"></div>
          <div class="lamp-base"></div>
        </div>
        <div class="tabletop"></div>
        <div class="table-leg leg-a"></div>
        <div class="table-leg leg-b"></div>
        <span class="whisky" title="A dram of scotch">🥃</span>
      </div>

      <!-- Persian-ish coffee table w/ book -->
      <div class="coffee-table">
        <div class="ct-top"></div>
        <div class="ct-leg ct-a"></div>
        <div class="ct-leg ct-b"></div>
        <span class="stacked-book book-navy"></span>
        <span class="stacked-book book-cream"></span>
      </div>

      <!-- Potted palm -->
      <div class="plant">
        <div class="leaves">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="pot"></div>
      </div>

    </section>
  </main>

  <footer class="plaque">
    <p><strong>The Polo Room.</strong> A fan-made tribute to the world of preppy Americana — oxford cloth, saddle leather, and horses at dusk. Not affiliated with or endorsed by Ralph Lauren Corporation.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
