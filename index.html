<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OFWML Sample Received Log</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14212b;--muted:#5b6b78;--line:#d7dee4;--accent:#0b5f7a;--accent-ink:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
header{margin-bottom:20px}
.org{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700}
h1{font-size:26px;margin:4px 0 2px}
.ar{font-family:"Noto Sans Arabic",system-ui,sans-serif;direction:rtl}
.sub{color:var(--muted);margin:0}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.f{margin-bottom:16px}
label{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:14px;margin-bottom:6px}
label .ar{font-weight:400;color:var(--muted)}
.req{color:#b42318}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{font-weight:400;justify-content:flex-start;align-items:center;margin:0;border:1px solid var(--line);border-radius:9px;padding:9px 10px}
.checks input{width:auto;margin:0}
button{width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.hidden{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
@media (max-width:420px){.row,.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="org">Petroleum Research Center, Ahmadi</div>
  <h1>Sample Received Log Book</h1>
  <p class="sub">Oil Field Water Management Lab</p>
  <p class="sub ar">سجل استلام العينات</p>
</header>

<form id="sampleForm" action="https://formsubmit.co/Hjeragh@kisr.edu.kw" method="POST">
  <input type="hidden" name="_subject" value="New OFWML sample submission">
  <input type="hidden" name="_cc" value="mbnkhjeragh@gmail.com">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="false">
  <input type="hidden" name="_next" value="">
  <input type="text" name="_honey" class="hidden" tabindex="-1" autocomplete="off">

  <div class="f">
    <label for="date">Request Date <span class="req">*</span><span class="ar">تاريخ الطلب</span></label>
    <input id="date" name="Request Date" type="date" required>
  </div>

  <div class="row">
    <div class="f">
      <label for="requestor">Requestor <span class="req">*</span></label>
      <input id="requestor" name="Requestor" type="text" required>
    </div>
    <div class="f">
      <label for="project">Project <span class="req">*</span></label>
      <input id="project" name="Project" type="text" required>
    </div>
  </div>

  <div class="row">
    <div class="f">
      <label for="field">Field</label>
      <input id="field" name="Field" type="text">
    </div>
    <div class="f">
      <label for="by">Submitted by <span class="req">*</span></label>
      <input id="by" name="Submitted by" type="text" required>
    </div>
  </div>

  <div class="f">
    <label for="desc">Sample Description <span class="req">*</span><span class="ar">وصف العينة</span></label>
    <textarea id="desc" name="Sample Description" required placeholder="e.g. T-101 A/A + Pr."></textarea>
  </div>

  <div class="row">
    <div class="f">
      <label for="n">No. of Sample <span class="req">*</span></label>
      <input id="n" name="No. of Sample" type="text" required placeholder="e.g. 2+1">
    </div>
    <div class="f">
      <label for="analysis">Analysis Required <span class="req">*</span></label>
      <input id="analysis" name="Analysis Required" type="text" required placeholder="e.g. API" list="analyses">
      <datalist id="analyses">
        <option value="API"><option value="pH"><option value="Conductivity / TDS"><option value="Turbidity">
        <option value="Density"><option value="Viscosity"><option value="Oil in water"><option value="Ions analysis"><option value="FTIR">
      </datalist>
    </div>
  </div>

  <div class="f">
    <label for="remarks">Remarks <span class="ar">ملاحظات</span></label>
    <textarea id="remarks" name="Remarks"></textarea>
  </div>

  <button type="submit">Submit · إرسال</button>
</form>
<footer>Receive By and LIMS Job ID are filled in by the lab.<br>Oil Field Water Management Lab · KISR</footer>
</div>
<script>
const f=document.getElementById('sampleForm');
f.querySelector('[name=_next]').value=new URL('thanks.html',location.href).href;
const d=new Date();document.getElementById('date').value=new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
f.addEventListener('submit',()=>{
  const proj=(f.querySelector('[name="Project"]').value||'').trim();
  f.querySelector('[name=_subject]').value='New OFWML sample submission – '+(proj||'sample received');
  const b=f.querySelector('button');b.disabled=true;b.textContent='Sending… · جاري الإرسال';
});
</script>
</body>
</html>
