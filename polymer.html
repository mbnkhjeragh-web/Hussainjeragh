<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Polymerization — an interactive animation</title>
<meta name="description" content="Watch monomers drift, collide, and link into wriggling polymer chains — a real-time spring-physics simulation on canvas." />
<style>
  :root{
    --bg0:#070b16; --bg1:#0d1428; --ink:#e8eefc; --muted:#8fa0c4;
    --accent:#5ad1c9; --accent2:#7c6bff; --line:rgba(140,160,220,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #14203f, var(--bg0) 65%);
    color:var(--ink); overflow:hidden;
  }
  #c{position:fixed;inset:0;display:block}
  .hud{
    position:fixed; left:0; right:0; top:0; z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; padding:16px 20px;
    background:linear-gradient(180deg, rgba(7,11,22,.75), transparent);
    pointer-events:none;
  }
  .title{display:flex;flex-direction:column;line-height:1.2}
  .title b{font-size:16px;letter-spacing:.02em}
  .title span{font-size:11.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .panel{display:flex;gap:8px;flex-wrap:wrap;pointer-events:auto}
  button, .seg{
    font:inherit;font-size:12.5px;cursor:pointer;color:var(--ink);
    background:rgba(30,42,74,.7);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;transition:.2s;
    display:inline-flex;align-items:center;gap:7px;
  }
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button.primary{background:linear-gradient(180deg,#6b5cff,#4a3fd0);border-color:transparent}
  button.primary:hover{filter:brightness(1.1)}
  .stat{
    position:fixed;left:20px;bottom:16px;z-index:5;font-size:12px;color:var(--muted);
    display:flex;gap:18px;background:rgba(7,11,22,.6);padding:8px 14px;border-radius:10px;
    border:1px solid var(--line);
  }
  .stat b{color:var(--accent);font-variant-numeric:tabular-nums}
  .hint{
    position:fixed;right:20px;bottom:16px;z-index:5;font-size:11.5px;color:var(--muted);
    background:rgba(7,11,22,.6);padding:8px 14px;border-radius:10px;border:1px solid var(--line);
  }
  @media (max-width:600px){ .title span{display:none} .hint{display:none} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <div class="title">
    <b>Polymerization</b>
    <span>monomers → chains · live spring physics</span>
  </div>
  <div class="panel">
    <button id="playBtn" class="primary">❚❚ Pause</button>
    <button id="addBtn">＋ Add monomers</button>
    <button id="linkBtn">⚗︎ Polymerize burst</button>
    <button id="heatBtn">🌡 Heat: <span id="heatLbl">med</span></button>
    <button id="resetBtn">↺ Reset</button>
  </div>
</div>

<div class="stat">
  <span>monomers <b id="mCount">0</b></span>
  <span>chains <b id="cCount">0</b></span>
  <span>longest <b id="lCount">0</b></span>
  <span>degree of polymerization <b id="dp">0.0</b></span>
</div>
<div class="hint">Click / drag to stir · monomers bond on contact</div>

<script>
(() => {
"use strict";
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width  = Math.floor(innerWidth  * DPR);
  H = cv.height = Math.floor(innerHeight * DPR);
  cv.style.width = innerWidth + "px";
  cv.style.height = innerHeight + "px";
}
addEventListener("resize", resize); resize();

// ---- tunables ----
const R = 7 * DPR;            // monomer radius
const BOND = 20 * DPR;        // rest length of a bond
const BOND_R2 = (BOND*0.75)**2; // capture distance^2 for forming a bond
let TEMP = 1.0;               // Brownian temperature (heat)
const HEATS = [{k:"low",v:0.45},{k:"med",v:1.0},{k:"high",v:1.9}];
let heatIdx = 1;

const palette = ["#5ad1c9","#7c6bff","#ff7ac6","#ffd166","#6be585","#4ea8ff"];

let nextId = 1;
class Node {
  constructor(x,y){
    this.id = nextId++;
    this.x=x; this.y=y; this.px=x; this.py=y;    // verlet
    this.links = [];                              // bonded neighbours (max 2)
    this.chain = this.id;                         // chain root id (union-find-ish)
    this.hue = palette[(Math.random()*palette.length)|0];
    this.free = true;                             // not yet bonded
  }
  get open(){ return this.links.length < 2; }     // valence: 2 (linear chains)
}
let nodes = [];

function spawn(n, cx, cy, spread){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = Math.random()*(spread||Math.min(W,H)*0.42);
    const x = (cx ?? W/2) + Math.cos(a)*r;
    const y = (cy ?? H/2) + Math.sin(a)*r;
    nodes.push(new Node(
      Math.max(R, Math.min(W-R, x)),
      Math.max(R, Math.min(H-R, y))
    ));
  }
}

function reset(){ nodes = []; nextId = 1; spawn(90); }
reset();

// ---- bonding ----
function bond(a,b){
  if(a===b || !a.open || !b.open) return false;
  if(a.links.includes(b)) return false;
  // prevent tiny rings: don't bond two nodes already in same short chain end-to-end incorrectly
  a.links.push(b); b.links.push(a);
  a.free = b.free = false;
  b.hue = a.hue;                 // chain shares a colour
  recolour(a);
  return true;
}

// spatial hash for neighbour queries
function tryBonds(){
  const cell = BOND, cols = Math.ceil(W/cell)+1;
  const grid = new Map();
  const key = (cx,cy)=>cx+cy*cols;
  for(const nd of nodes){
    const cx=(nd.x/cell)|0, cy=(nd.y/cell)|0;
    const k=key(cx,cy); (grid.get(k) || grid.set(k,[]).get(k)).push(nd);
  }
  for(const nd of nodes){
    if(!nd.open) continue;
    const cx=(nd.x/cell)|0, cy=(nd.y/cell)|0;
    for(let gx=-1;gx<=1;gx++) for(let gy=-1;gy<=1;gy++){
      const bucket = grid.get(key(cx+gx,cy+gy)); if(!bucket) continue;
      for(const o of bucket){
        if(o.id<=nd.id || !o.open) continue;
        const dx=o.x-nd.x, dy=o.y-nd.y;
        if(dx*dx+dy*dy < BOND_R2) bond(nd,o);
      }
    }
  }
}

// flood colour across a chain
function recolour(seed){
  const hue = seed.hue, seen=new Set([seed]), stack=[seed];
  while(stack.length){ const n=stack.pop(); n.hue=hue;
    for(const l of n.links) if(!seen.has(l)){seen.add(l);stack.push(l);} }
}

// ---- physics (verlet + constraints) ----
let mouse={x:0,y:0,down:false};
function step(){
  const damp=0.86, jitter=0.55*DPR*TEMP;
  for(const n of nodes){
    let vx=(n.x-n.px)*damp, vy=(n.y-n.py)*damp;
    vx += (Math.random()-0.5)*jitter;
    vy += (Math.random()-0.5)*jitter;
    n.px=n.x; n.py=n.y; n.x+=vx; n.y+=vy;
    // stir
    if(mouse.down){
      const dx=n.x-mouse.x, dy=n.y-mouse.y, d2=dx*dx+dy*dy, rad=120*DPR;
      if(d2<rad*rad){ const d=Math.sqrt(d2)||1, f=(1-d/rad)*6*DPR; n.x+=dx/d*f; n.y+=dy/d*f; }
    }
  }
  // bond constraints (springs, solved a few iterations)
  for(let it=0; it<3; it++){
    for(const n of nodes){
      for(const l of n.links){
        if(l.id<n.id) continue;
        const dx=l.x-n.x, dy=l.y-n.y, d=Math.hypot(dx,dy)||1;
        const diff=(d-BOND)/d*0.5, ox=dx*diff, oy=dy*diff;
        n.x+=ox; n.y+=oy; l.x-=ox; l.y-=oy;
      }
    }
    // soft repulsion so monomers don't overlap
    // (cheap: only against near mouse handled; global via grid)
  }
  // walls
  for(const n of nodes){
    if(n.x<R){n.x=R;n.px=R;} if(n.x>W-R){n.x=W-R;n.px=W-R;}
    if(n.y<R){n.y=R;n.py=R;} if(n.y>H-R){n.y=H-R;n.py=H-R;}
  }
  tryBonds();
}

// ---- stats ----
function chains(){
  const seen=new Set(), out=[];
  for(const n of nodes){
    if(seen.has(n)) continue;
    const comp=[], stack=[n]; seen.add(n);
    while(stack.length){ const c=stack.pop(); comp.push(c);
      for(const l of c.links) if(!seen.has(l)){seen.add(l);stack.push(l);} }
    out.push(comp);
  }
  return out;
}

// ---- render ----
function draw(){
  ctx.clearRect(0,0,W,H);
  // faint solution glow
  const g=ctx.createRadialGradient(W/2,H*0.2,0,W/2,H*0.2,Math.max(W,H)*0.8);
  g.addColorStop(0,"rgba(40,60,110,.25)"); g.addColorStop(1,"rgba(7,11,22,0)");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);

  // bonds
  ctx.lineCap="round";
  for(const n of nodes){
    for(const l of n.links){
      if(l.id<n.id) continue;
      ctx.strokeStyle=n.hue; ctx.globalAlpha=0.55; ctx.lineWidth=3.5*DPR;
      ctx.beginPath(); ctx.moveTo(n.x,n.y); ctx.lineTo(l.x,l.y); ctx.stroke();
    }
  }
  ctx.globalAlpha=1;
  // monomers
  for(const n of nodes){
    ctx.beginPath(); ctx.arc(n.x,n.y,R,0,7);
    if(n.free){
      ctx.fillStyle="rgba(150,170,220,.9)";
      ctx.fill();
      ctx.lineWidth=1.5*DPR; ctx.strokeStyle="rgba(200,215,255,.5)"; ctx.stroke();
    } else {
      ctx.fillStyle=n.hue; ctx.fill();
      ctx.save(); ctx.globalAlpha=.35; ctx.beginPath();
      ctx.arc(n.x-R*0.3,n.y-R*0.3,R*0.4,0,7); ctx.fillStyle="#fff"; ctx.fill(); ctx.restore();
    }
  }
}

// ---- HUD update ----
const el = id=>document.getElementById(id);
let statTimer=0;
function updateStats(){
  const comps=chains();
  const linked=comps.filter(c=>c.length>1);
  const longest=comps.reduce((m,c)=>Math.max(m,c.length),0);
  const bonded=nodes.filter(n=>!n.free).length;
  el("mCount").textContent=nodes.length;
  el("cCount").textContent=linked.length;
  el("lCount").textContent=longest;
  el("dp").textContent=(linked.length? (bonded/Math.max(1,linked.length)).toFixed(1):"0.0");
}

// ---- loop ----
let playing=true;
function frame(){
  if(playing){ step(); }
  draw();
  if((statTimer++ & 7)===0) updateStats();
  requestAnimationFrame(frame);
}
frame();

// ---- controls ----
el("playBtn").onclick=e=>{ playing=!playing; e.currentTarget.textContent=playing?"❚❚ Pause":"► Play"; };
el("addBtn").onclick=()=>spawn(30);
el("linkBtn").onclick=()=>{ for(let i=0;i<6;i++) tryBonds(); }; // several passes = burst
el("resetBtn").onclick=reset;
el("heatBtn").onclick=()=>{ heatIdx=(heatIdx+1)%HEATS.length; TEMP=HEATS[heatIdx].v; el("heatLbl").textContent=HEATS[heatIdx].k; };

function pos(e){ const r=cv.getBoundingClientRect(); const t=e.touches?e.touches[0]:e;
  return {x:(t.clientX-r.left)*DPR, y:(t.clientY-r.top)*DPR}; }
cv.addEventListener("mousedown",e=>{mouse.down=true;Object.assign(mouse,pos(e));});
cv.addEventListener("mousemove",e=>Object.assign(mouse,pos(e)));
addEventListener("mouseup",()=>mouse.down=false);
cv.addEventListener("touchstart",e=>{mouse.down=true;Object.assign(mouse,pos(e));e.preventDefault();},{passive:false});
cv.addEventListener("touchmove",e=>{Object.assign(mouse,pos(e));e.preventDefault();},{passive:false});
addEventListener("touchend",()=>mouse.down=false);
})();
</script>
</body>
</html>
